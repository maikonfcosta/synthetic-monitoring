name: Synthetic Monitoring (Nightly Full Ring)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-audit:
    name: Full Asset & Security Probe
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Full Synthetic Checks
        id: full_probe
        run: npm run test:full
        continue-on-error: true

      - name: Generate Monitoring Summary
        run: npm run summary
        continue-on-error: true

      - name: Upload Test Report & Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Fail Job If Full Probe Failed
        if: steps.full_probe.outcome != 'success'
        run: |
          echo "Nightly full synthetic audit detected asset or protocol failures."
          exit 1
